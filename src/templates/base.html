<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Davison Financial Model">
    <title>{% block title %}Financial Model{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/portfolio">Financial Model</a>
            <nav class="main-nav" aria-label="Main navigation">
                {% for item in navigation %}
                <a class="nav-link{% if request.url.path == item.path %} active{% endif %}"
                   href="{{ item.path }}">{{ item.label }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
